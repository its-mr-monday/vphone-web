# air — hot reload for the Go server in development.
# Rebuilds and restarts on .go changes; passes -dev-proxy so non-API routes
# are reverse-proxied to the Vite dev server.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/vphone-web ./cmd/vphone-web"
  bin = "./tmp/vphone-web"
  full_bin = "./tmp/vphone-web -dev-proxy http://localhost:5173 -log-level debug"
  include_ext = ["go", "sql", "toml"]
  exclude_dir = ["web", "bin", "tmp", "vphone-cli", "vendor"]
  delay = 400
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
