# vphone-web configuration.
#
# Copy to ~/.config/vphone-web/config.toml and edit as needed. Every field has
# a sane default — the server runs with zero configuration. Any value can be
# overridden via VPHONE_WEB_* environment variables (e.g. VPHONE_WEB_PORT).

[server]
host = "0.0.0.0"
port = 8080
# dev_proxy = "http://localhost:5173"   # set by `make dev`; leave empty in prod
headless_vms = false                    # boot VMs with no host window (web/VNC only)
# HTTPS. tls_enabled turns on TLS for the web console and the --agent control
# link. With tls_cert + tls_key set, those (real/signed) PEM files are used —
# use this for production or any environment with a proper cert. With tls_enabled
# on but no files, the server generates an in-memory self-signed cert (labs /
# worker agents) — controllers accept it once via trust-on-first-use pinning.
tls_enabled = false
# tls_cert = "~/.vphone-web/tls/cert.pem"
# tls_key  = "~/.vphone-web/tls/key.pem"

[paths]
vphone_cli = "./vphone-cli"             # path to the vphone-cli submodule
vm_root    = "~/.vphone-web/vms"        # where VM directories are created
ipsw_dir   = "~/.vphone-web/ipsws"      # IPSW storage
data_dir   = "~/.vphone-web"            # SQLite database + server state

[ports]
base       = 10000                      # first host port for VM allocations
block_size = 10                         # host ports reserved per VM

[limits]
max_concurrent_vms  = 4                 # max simultaneously running VMs
max_concurrent_jobs = 2                 # max parallel background jobs

[guest]
vnc_password = "alpine"                 # RFB password for the guest TrollVNC server
ssh_user     = "root"                   # dropbear SSH user for the web terminal
ssh_password = "alpine"

# Access control — disabled by default (single-user). See
# docs/access-control-and-clustering.md. Roles: vphone-admin, vphone-user.
[auth]
enabled            = false
session_ttl        = "12h"
bootstrap_admin    = "admin"            # created on first start when enabled + no users
bootstrap_password = ""                 # set once; the account must change it on login
default_role       = "vphone-user"      # role for external users with no group match

# Map external directory groups (LDAP memberOf CN / OIDC or SAML group claim) to
# roles. Users whose groups match nothing get default_role.
# [auth.role_map]
# "vphone-admins" = "vphone-admin"
# "vphone-users"  = "vphone-user"

# LDAP / Active Directory (search-then-bind). Users log in with the normal
# username+password form; matched group CNs feed [auth.role_map].
# [auth.ldap]
# enabled       = true
# url           = "ldaps://ldap.example.com:636"  # ldap:// or ldaps://
# bind_dn       = "cn=svc,dc=example,dc=com"       # service account ("" = anonymous)
# bind_password = "..."
# base_dn       = "dc=example,dc=com"
# user_filter   = "(sAMAccountName=%s)"            # AD; or "(uid=%s)" for OpenLDAP
# group_filter  = "(member=%s)"                    # optional; %s = the user's DN
# insecure      = false                            # true skips TLS verification (labs)

# OIDC / OAuth2 (browser SSO — Okta, Entra ID, Google, Keycloak, …).
# [auth.oidc]
# enabled       = true
# issuer        = "https://accounts.example.com"   # discovery base URL
# client_id     = "vphone-web"
# client_secret = "..."
# redirect_url  = "https://vphone.example.com/api/v1/auth/oidc/callback"
# groups_claim  = "groups"                          # ID-token claim holding group names

# SAML 2.0 (browser SSO via IdP metadata).
# [auth.saml]
# enabled          = true
# idp_metadata_url = "https://idp.example.com/metadata"
# entity_id        = "https://vphone.example.com/saml/metadata"
# acs_url          = "https://vphone.example.com/api/v1/auth/saml/acs"

# Clustering — a controller manages worker nodes (each a `vphone-web --agent`).
# The system password is the shared secret on the controller↔worker control link.
# Set it via VPHONE_SYSTEM_PASSWORD, a .env file, or here.
[cluster]
system_password    = ""                 # required to run --agent, and to register nodes
heartbeat_interval = "10s"              # how often the controller health-polls nodes
