# vphone-web configuration.
#
# Copy to ~/.config/vphone-web/config.toml and edit as needed. Every field has
# a sane default — the server runs with zero configuration. Any value can be
# overridden via VPHONE_WEB_* environment variables (e.g. VPHONE_WEB_PORT).

[server]
host = "0.0.0.0"
port = 8080
# dev_proxy = "http://localhost:5173"   # set by `make dev`; leave empty in prod
headless_vms = false                    # boot VMs with no host window (web/VNC only)

[paths]
vphone_cli = "./vphone-cli"             # path to the vphone-cli submodule
vm_root    = "~/.vphone-web/vms"        # where VM directories are created
ipsw_dir   = "~/.vphone-web/ipsws"      # IPSW storage
data_dir   = "~/.vphone-web"            # SQLite database + server state

[ports]
base       = 10000                      # first host port for VM allocations
block_size = 10                         # host ports reserved per VM

[limits]
max_concurrent_vms  = 4                 # max simultaneously running VMs
max_concurrent_jobs = 2                 # max parallel background jobs

[guest]
vnc_password = "alpine"                 # RFB password for the guest TrollVNC server
ssh_user     = "root"                   # dropbear SSH user for the web terminal
ssh_password = "alpine"

# Access control — disabled by default (single-user). See
# docs/access-control-and-clustering.md. Roles: vphone-admin, vphone-user.
[auth]
enabled            = false
session_ttl        = "12h"
bootstrap_admin    = "admin"            # created on first start when enabled + no users
bootstrap_password = ""                 # set once; the account must change it on login
default_role       = "vphone-user"      # role for external users with no group match

# Map external directory groups to roles (LDAP/OIDC/SAML — added incrementally):
# [auth.role_map]
# "vphone-admins" = "vphone-admin"
# "vphone-users"  = "vphone-user"

# [auth.ldap]
# enabled = true
# url = "ldaps://ldap.example.com" ; base_dn = "dc=example,dc=com"
# bind_dn = "..." ; bind_password = "..." ; user_filter = "(uid=%s)"

# Clustering — a controller manages worker nodes (each a `vphone-web --agent`).
# The system password is the shared secret on the controller↔worker control link.
# Set it via VPHONE_SYSTEM_PASSWORD, a .env file, or here.
[cluster]
system_password    = ""                 # required to run --agent, and to register nodes
heartbeat_interval = "10s"              # how often the controller health-polls nodes
